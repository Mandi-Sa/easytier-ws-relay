name = "easytier-ws-relay-worker"
main = "src/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WS_PATH = "ws"
EASYTIER_DISABLE_RELAY = "0"
EASYTIER_COMPRESS_RPC = "0"
EASYTIER_PUBLIC_SERVER_NETWORK_NAME = "public_server"
EASYTIER_DEBUG = "0"
EASYTIER_MAX_CONNECTIONS = "256"

[durable_objects]
bindings = [
  { name = "RELAY_ROOM", class_name = "RelayRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
